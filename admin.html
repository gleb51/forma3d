<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA 3D — редактор</title><style>body{background:#f3e9db;color:#382b22;font:16px system-ui;margin:auto;max-width:780px;padding:20px}h1{font-size:28px}section{background:#fffaf3;padding:18px;border-radius:16px;margin:16px 0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;box-sizing:border-box;padding:11px;border:1px solid #c9b9a7;border-radius:8px;max-width:100%}input:not([type=checkbox]),select,textarea{width:100%}button{background:#72543d;color:white;cursor:pointer;margin:5px 4px 5px 0}button.secondary{background:white;color:#382b22}small{color:#705f51}img{width:72px;height:72px;object-fit:cover;border-radius:8px}article{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:10px 0}article div{flex:1}a{color:#72543d}textarea{min-height:80px}</style><h1>FORMA 3D / Редактор</h1><p>Редактируй каталог без изменения HTML. Черновик хранится в браузере; публикация — загрузкой JSON в GitHub.</p><section><button id="add">+ Новый товар</button><button id="export">Скачать products.json</button><a href="https://github.com/gleb51/forma3d/upload/main" target="_blank" rel="noopener">Загрузить в GitHub</a><label>Импорт каталога JSON<input type="file" id="import" accept=".json"></label><button class="secondary" id="reset">Загрузить опубликованный каталог</button><p id="message" role="status"></p><div id="list"></div></section><section id="editor" hidden><h2>Карточка товара</h2><form id="form"><label>ID (латиница, без пробелов)<input name="id" required pattern="[a-zA-Z0-9_-]+"></label><label>Название<input name="name" required></label><label>Категория<select name="category"><option value="decor">Декор</option><option value="toys">Игрушки</option><option value="sales">Акции</option><option value="planters">Горшки</option></select></label><label>Тип<input name="type"></label><label>Описание<textarea name="description"></textarea></label><label>Размеры<input name="dimensions"></label><label>Цена, ₽<input name="price" type="number" min="0" required></label><label>Путь к обложке<input name="image" required placeholder="assets/phone.webp"></label><label>Путь к STL (необязательно)<input name="model" placeholder="assets/models/phone.stl"></label><small>Файлы изображений и STL загружаются в GitHub отдельно по указанным путям.</small><label><input type="checkbox" name="white" checked> Белый</label><label><input type="checkbox" name="black" checked> Чёрный</label><label><input type="checkbox" name="hidden"> Скрыть товар</label><button type="submit">Сохранить в черновик</button><button type="button" class="secondary" id="cancel">Отмена</button></form></section><section><h2>Калькулятор (не публикуется)</h2><label>Вес, г<input id="grams" type="number" min="0"></label><label>Время, ч<input id="hours" type="number" min="0" step="any"></label><label>Пластик, ₽/кг<input id="rate" type="number" value="900"></label><label>Расходы на час, ₽ (электричество и износ)<input id="hourrate" type="number" placeholder="Укажи свою ставку"></label><label>Цена продажи, ₽<input id="sale" type="number"></label><p id="calc"></p></section><script>
const $=id=>document.getElementById(id),key='forma-admin-draft-v1';let items=[],editing=-1;const f=$('form');function msg(t){$('message').textContent=t}function save(){localStorage.setItem(key,JSON.stringify(items));render()}function render(){const list=$('list');list.replaceChildren();items.forEach((p,i)=>{const a=document.createElement('article'),im=document.createElement('img'),d=document.createElement('div'),b=document.createElement('button'),del=document.createElement('button');im.src=p.image;im.alt='';d.textContent=p.name+' · '+p.price+' ₽'+(p.hidden?' · скрыт':'');b.textContent='Изменить';b.onclick=()=>edit(i);del.textContent='Удалить';del.className='secondary';del.onclick=()=>{if(confirm('Удалить '+p.name+' из черновика?')){items.splice(i,1);save();$('editor').hidden=true}};a.append(im,d,b,del);list.append(a)})}function edit(i){editing=i;f.reset();const p=items[i]||{id:'',name:'',category:'decor',price:0,image:'',model:'',colors:['white','black']};for(const k of ['id','name','category','type','description','dimensions','price','image','model'])f.elements[k].value=p[k]??'';for(const c of ['white','black'])f.elements[c].checked=p.colors.includes(c);f.elements.hidden.checked=!!p.hidden;$('editor').hidden=false;$('editor').scrollIntoView({behavior:'smooth'})}f.onsubmit=e=>{e.preventDefault();const p=Object.fromEntries(new FormData(f));p.price=Number(p.price);p.colors=['white','black'].filter(c=>f.elements[c].checked);p.hidden=f.elements.hidden.checked;delete p.white;delete p.black;if(!p.colors.length)return alert('Выбери цвет');if(items.some((x,i)=>i!==editing&&x.id===p.id))return alert('ID уже занят');if(editing<0)items.push(p);else items[editing]=p;save();$('editor').hidden=true;msg('Черновик сохранён. Для публикации скачай JSON.')};$('add').onclick=()=>edit(-1);$('cancel').onclick=()=>$('editor').hidden=true;$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='products.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};function valid(x){return Array.isArray(x)&&x.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&typeof p.image==='string'&&Number.isFinite(p.price)&&Array.isArray(p.colors)&&p.colors.length)}async function load(){try{const r=await fetch('products.json',{cache:'no-store'});if(!r.ok)throw Error();const x=await r.json();if(!valid(x))throw Error();items=x;save();msg('Каталог загружен')}catch(e){msg('Не удалось загрузить JSON. Импортируй файл вручную.')}}$('reset').onclick=()=>{if(confirm('Заменить локальный черновик опубликованным каталогом?'))load()};$('import').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!valid(x))throw Error();items=x;save();msg('Импорт выполнен')}catch(e){msg('Неверный файл каталога')}};try{const x=JSON.parse(localStorage.getItem(key));if(valid(x)){items=x;render()}else load()}catch(e){load()}function calc(){const n=id=>Number($(id).value),m=n('grams')*n('rate')/1000,known=$('hourrate').value!=='',cost=m+n('hours')*n('hourrate');$('calc').textContent='Пластик: '+m.toFixed(2)+' ₽. '+(known?'Расчётные затраты: '+cost.toFixed(2)+' ₽. Остаток: '+(n('sale')-cost).toFixed(2)+' ₽.':'Остаток без электричества и износа: '+(n('sale')-m).toFixed(2)+' ₽.')};for(const id of ['grams','hours','rate','hourrate','sale'])$(id).oninput=calc;calc();</script></html>
